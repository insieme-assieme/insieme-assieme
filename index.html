<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM Map - Date Filtered</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #map {
            height: 550px;
            width: 100%;
            border-radius: 8px;
        }
        /* Style for the filter dashboard box at the top */
        .filter-panel {
            background: #f4f4f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-panel label {
            font-weight: bold;
        }
        .filter-panel input, .filter-panel button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .filter-panel button {
            background: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        .filter-panel button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Map Locations with Date Filtering</h2>

    <div class="filter-panel">
        <label for="minDate">Min Date:</label>
        <input type="date" id="minDate" value="2026-01-01">

        <label for="maxDate">Max Date:</label>
        <input type="date" id="maxDate" value="2026-12-31">

        <button onclick="fetchAndParseCSV()">Apply Filter</button>
    </div>
    
    <div id="map"></div>

    <script>
        // Initialize Map centered on Pergine Valsugana
        const map = L.map('map').setView([46.0620, 11.2407], 13);

        // Load OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // A LayerGroup keeps track of our active map pins so we can clear them easily
        const markerLayerGroup = L.layerGroup().addTo(map);

        // Standard Geocoding Function
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
            try {
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'YourAppNameOrEmail@domain.com' }
                });
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon)
                    };
                }
            } catch (error) {
                console.error(`Error geocoding "${address}":`, error);
            }
            return null;
        }

        // Loop through the filtered array and place pins
        async function plotAddresses(locationsArray) {
            // 2. CLEAR PREVIOUS PINS: Wipe out any pins from the last filter run
            markerLayerGroup.clearLayers();
            const markers = [];

            for (const location of locationsArray) {
                if (!location.address) continue;

                const coords = await geocodeAddress(location.address);
                if (coords) {
                    // Create the marker and add it specifically to our LayerGroup instead of raw map
                    const marker = L.marker([coords.lat, coords.lon])
                        .bindPopup(`<b>${location.label}</b><br><small>Date: ${location.date}</small>`);
                    
                    markerLayerGroup.addLayer(marker);
                    markers.push(marker);
                }
                await new Promise(resolve => setTimeout(resolve, 1000)); // Rate limit safety
            }

            // Zoom map to frame the newly filtered points
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // FETCH AND PARSE FUNCTION WITH DATE FILTER LOGIC
        async function fetchAndParseCSV() {
            try {
                // 3. GET DATES FROM THE HTML INPUTS
                const minDateValue = document.getElementById('minDate').value; // e.g., "2026-01-01"
                const maxDateValue = document.getElementById('maxDate').value; // e.g., "2026-12-31"

                // Fetch the CSV text natively
                const response = await fetch('locations.csv');
                const rawText = await response.text();
                const lines = rawText.split('\n');

                const filteredLocations = [];

                // Loop through CSV lines (skip header line i=0)
                for (let i = 1; i < lines.length; i++) {
                    const currentLine = lines[i].trim();
                    if (currentLine === '') continue;

                    // Split line by commas
                    const columns = currentLine.split(',');

                    // Clean quotes and spaces out of columns
                    const cleanAddress = columns[0].replace(/^"|"$/g, '').trim();
                    const cleanLabel = columns[1] ? columns[1].replace(/^"|"$/g, '').trim() : 'Location';
                    const rowDate = columns[2] ? columns[2].replace(/^"|"$/g, '').trim() : ''; // Grab the date column

                    // 4. DATE FILTER LOGIC
                    // Check if the current row's date fits between the selected range
                    // Because they are in YYYY-MM-DD format, strings can be compared directly (e.g. "2026-05" > "2026-01")
                    if (rowDate >= minDateValue && rowDate <= maxDateValue) {
                        filteredLocations.push({
                            address: cleanAddress,
                            label: cleanLabel,
                            date: rowDate
                        });
                    }
                }

                console.log("Filtered Locations Array:", filteredLocations);

                // Hand over only the rows that successfully passed our date check
                plotAddresses(filteredLocations);

            } catch (error) {
                console.error("Error reading or filtering the CSV file:", error);
            }
        }

        // Run automatically when the webpage first finishes loading using the default inputs
        fetchAndParseCSV();
    </script>
</body>
</html>
